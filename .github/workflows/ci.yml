name: CI

on:
  pull_request:
    branches: [ develop, main ]

  push:
    branches: [ develop, main ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 프론트 빌드 실패를 PR 단계에서 잡는다.
  # 이게 없으면 CI 는 통과했는데 CD 의 도커 빌드에서 터진다.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-node 의 cache: pnpm 이 pnpm 을 먼저 찾으므로 순서를 바꾸면 안 된다.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: 프론트엔드 의존성 설치
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: 프론트엔드 빌드
        working-directory: frontend
        run: pnpm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 컴파일 확인
        run: ./gradlew clean compileJava compileTestJava --console=plain

      - name: Build & Test
        run: ./gradlew test jacocoTestReport --console=plain

      # Jacoco 보고서 생성
      - name: JaCoCo Coverage Summary
        if: always()
        run: python3 scripts/jacoco-summary.py

      # 포크에서 온 PR 은 permissions 블록과 무관하게 GITHUB_TOKEN 이 읽기 전용으로
      # 발급되므로 코멘트를 달 수 없다. 이 경우 스텝을 건너뛰어 CI 가 실패하지 않게 한다.
      # 커버리지 수치는 jacoco-summary.py 가 GITHUB_STEP_SUMMARY 에도 쓰므로
      # Actions 실행 요약에서 그대로 확인할 수 있다.
      - name: PR에 JaCoCo 보고서 코멘트
        if: >
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && hashFiles('jacoco-comment.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file jacoco-comment.md \
            --edit-last \
            --create-if-none