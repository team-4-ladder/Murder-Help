openapi: "3.1.0"
info:
  title: "Murder_Help API"
  description: "Murder_Help API"
  version: "1.0.0"
servers:
  - url: "https://localhost:8080"
paths:
  /api/auth/signup:
    post:
      summary: "POST api/auth/signup"
      operationId: "signup"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/auth/login:
    post:
      summary: "POST api/auth/login"
      operationId: "login"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/auth/reissue:
    post:
      summary: "POST api/auth/reissue"
      operationId: "reissue"
      parameters:
        - name: "refreshToken"
          in: "cookie"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/auth/logout:
    post:
      summary: "POST api/auth/logout"
      operationId: "logout"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/orders:
    post:
      summary: "POST api/orders"
      operationId: "createOrder"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
    get:
      summary: "GET api/orders"
      operationId: "getOrderList"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /api/orders/{orderId}:
    get:
      summary: "GET api/orders/{orderId}"
      operationId: "getOrder"
      parameters:
        - name: "orderId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OrderResponse"
  /api/members/me:
    patch:
      summary: "PATCH api/members/me"
      operationId: "updateMyInfo"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyInfoRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberResponse"
    get:
      summary: "GET api/members/me"
      operationId: "getMyInfo"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberResponse"
  /api/members/me/profile-image:
    patch:
      summary: "PATCH api/members/me/profile-image"
      operationId: "uploadProfileImage"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: "object"
              required:
                - "image"
              properties:
                image:
                  type: "string"
                  format: "binary"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberResponse"
    delete:
      summary: "DELETE api/members/me/profile-image"
      operationId: "deleteProfileImage"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MemberResponse"
  /api/payments/confirm:
    post:
      summary: "POST api/payments/confirm"
      operationId: "confirm"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfirmRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentConfirmResponse"
  /api/payments/{id}/cancel:
    post:
      summary: "POST api/payments/{id}/cancel"
      operationId: "cancel"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCancelRequest"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentCancelResponse"
  /api/payments/{id}/fail:
    post:
      summary: "POST api/payments/{id}/fail"
      operationId: "fail"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaymentCancelResponse"
  /api/products/{productId}:
    get:
      summary: "GET api/products/{productId}"
      operationId: "getProduct"
      parameters:
        - name: "productId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
  /api/products:
    get:
      summary: "GET api/products"
      operationId: "getProducts"
      parameters:
        - name: "category"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "subCategory"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "tier"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /api/v1/products/search:
    get:
      summary: "GET api/v1/products/search"
      operationId: "searchProducts"
      parameters:
        - name: "keyword"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "tier"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /api/v2/products/search:
    get:
      summary: "GET api/v2/products/search"
      operationId: "searchProductsV2"
      parameters:
        - name: "keyword"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "tier"
          in: "query"
          required: false
          schema:
            type: "string"
        - name: "sort"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
  /api/chat/rooms/{roomId}/close:
    patch:
      summary: "PATCH api/chat/rooms/{roomId}/close"
      operationId: "closeRoom"
      parameters:
        - name: "roomId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/chat/rooms:
    post:
      summary: "POST api/chat/rooms"
      operationId: "createRoom"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoomResponse"
    get:
      summary: "GET api/chat/rooms"
      operationId: "getAllRooms"
      parameters:
        - name: "customerId"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int64"
        - name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "BOT_MODE"
              - "WAITING"
              - "IN_PROGRESS"
              - "COMPLETED"
        - name: "keyword"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoomResponse"
  /api/chat/rooms/cache/recover:
    post:
      summary: "POST api/chat/rooms/cache/recover"
      operationId: "recoverCache"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "string"
  /api/chat/rooms/my:
    get:
      summary: "GET api/chat/rooms/my"
      operationId: "getMyRooms"
      parameters:
        - name: "status"
          in: "query"
          required: false
          schema:
            type: "string"
            enum:
              - "BOT_MODE"
              - "WAITING"
              - "IN_PROGRESS"
              - "COMPLETED"
        - name: "keyword"
          in: "query"
          required: false
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoomResponse"
  /api/chat/rooms/{roomId}:
    get:
      summary: "GET api/chat/rooms/{roomId}"
      operationId: "getRoom"
      parameters:
        - name: "roomId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatRoomResponse"
  /api/chat/rooms/{roomId}/messages:
    get:
      summary: "GET api/chat/rooms/{roomId}/messages"
      operationId: "getMessageHistory"
      parameters:
        - name: "roomId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ChatMessageResponse"
  /api/cart/items/{cartItemId}:
    patch:
      summary: "PATCH api/cart/items/{cartItemId}"
      operationId: "updateItemQuantity"
      parameters:
        - name: "cartItemId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemUpdateRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartItemResponse"
    delete:
      summary: "DELETE api/cart/items/{cartItemId}"
      operationId: "deleteItem"
      parameters:
        - name: "cartItemId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/cart/items:
    post:
      summary: "POST api/cart/items"
      operationId: "addItem"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemAddRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CartItemResponse"
    delete:
      summary: "DELETE api/cart/items"
      operationId: "deleteItems"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemsDeleteRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
    get:
      summary: "GET api/cart/items"
      operationId: "getItems"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/CartItemDetailResponse"
  /api/searches/popular:
    post:
      summary: "POST api/searches/popular"
      operationId: "recordPopularSearch"
      parameters:
        - name: "keyword"
          in: "query"
          required: true
          schema:
            type: "string"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
    get:
      summary: "GET api/searches/popular"
      operationId: "getPopularSearches"
      parameters:
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            format: "int32"
            default: "10"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PopularSearchResponse"
  /api/reviews/{reviewId}:
    patch:
      summary: "PATCH api/reviews/{reviewId}"
      operationId: "updateReview"
      parameters:
        - name: "reviewId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewUpdateRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponse"
    delete:
      summary: "DELETE api/reviews/{reviewId}"
      operationId: "deleteReview"
      parameters:
        - name: "reviewId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/reviews:
    post:
      summary: "POST api/reviews"
      operationId: "createReview"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreateRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReviewResponse"
  /api/reviews/pending:
    get:
      summary: "GET api/reviews/pending"
      operationId: "getPendingReviews"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/PendingReviewResponse"
  /api/reviews/me:
    get:
      summary: "GET api/reviews/me"
      operationId: "getMyReviews"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/MyReviewResponse"
  /api/config/portone:
    get:
      summary: "GET api/config/portone"
      operationId: "getConfig"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PortOneConfigResponse"
  /api/refunds:
    post:
      summary: "POST api/refunds"
      operationId: "processRefund"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RefundResponse"
  /api/refunds/refundable/{paymentId}:
    get:
      summary: "GET api/refunds/refundable/{paymentId}"
      operationId: "getRefundableItems"
      parameters:
        - name: "paymentId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/RefundableItemResponse"
  /api/refunds/history/{paymentId}:
    get:
      summary: "GET api/refunds/history/{paymentId}"
      operationId: "getRefundHistory"
      parameters:
        - name: "paymentId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/RefundHistoryResponse"
  /api/webhooks/portone:
    post:
      summary: "POST api/webhooks/portone"
      operationId: "handlePortOneWebhook"
      parameters:
        - name: "webhook-id"
          in: "header"
          required: true
          schema:
            type: "string"
        - name: "webhook-timestamp"
          in: "header"
          required: true
          schema:
            type: "string"
        - name: "webhook-signature"
          in: "header"
          required: true
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: "string"
        required: true
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/webhooks:
    get:
      summary: "GET api/webhooks"
      operationId: "getWebhookEvents"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/WebhookEvent"
  /api/admin/product-rankings/refresh:
    post:
      summary: "POST api/admin/product-rankings/refresh"
      operationId: "refresh"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Void"
  /api/products/{productId}/reviews:
    get:
      summary: "GET api/products/{productId}/reviews"
      operationId: "getProductReviews"
      parameters:
        - name: "productId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/ReviewResponse"
components:
  schemas:
    SignupRequest:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        email:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
        phone:
          type: "string"
          nullable: true
    Void:
      type: "object"
      properties: { }
    LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
          nullable: true
        password:
          type: "string"
          nullable: true
    TokenResponse:
      type: "object"
      properties:
        accessToken:
          type: "string"
          nullable: true
    CreateOrderRequest:
      type: "object"
      properties:
        cartItemIds:
          type: "array"
          nullable: true
          items:
            type: "integer"
            format: "int64"
        receiverName:
          type: "string"
          nullable: true
        receiverPhone:
          type: "string"
          nullable: true
        deliveryAddress:
          type: "string"
          nullable: true
        deliveryRequest:
          type: "string"
          nullable: true
    CreateOrderResponse:
      type: "object"
      properties:
        orderId:
          type: "integer"
          format: "int64"
          nullable: true
        paymentId:
          type: "integer"
          format: "int64"
          nullable: true
        portonePaymentId:
          type: "string"
          nullable: true
        orderNumber:
          type: "string"
          nullable: true
        status:
          type: "string"
          nullable: true
          enum:
            - "PENDING_PAYMENT"
            - "PAID"
            - "PREPARING_DELIVERY"
            - "SHIPPING"
            - "DELIVERED"
            - "CANCELED"
        totalAmount:
          type: "integer"
          format: "int64"
          nullable: true
    ReviewResponse:
      type: "object"
      properties:
        reviewId:
          type: "integer"
          format: "int64"
          nullable: true
        orderItemId:
          type: "integer"
          format: "int64"
          nullable: true
        productId:
          type: "integer"
          format: "int64"
          nullable: true
        rating:
          type: "integer"
          format: "int32"
          nullable: true
        content:
          type: "string"
          nullable: true
        createdAt:
          type: "string"
          format: "date-time"
          nullable: true
        updatedAt:
          type: "string"
          format: "date-time"
          nullable: true
    Item:
      type: "object"
      properties:
        productName:
          type: "string"
          nullable: true
        unitPrice:
          type: "integer"
          format: "int64"
          nullable: true
        quantity:
          type: "integer"
          format: "int32"
          nullable: true
        review:
          nullable: true
          $ref: "#/components/schemas/ReviewResponse"
    OrderResponse:
      type: "object"
      properties:
        orderId:
          type: "integer"
          format: "int64"
          nullable: true
        paymentId:
          type: "integer"
          format: "int64"
          nullable: true
        orderNumber:
          type: "string"
          nullable: true
        status:
          type: "string"
          nullable: true
          enum:
            - "PENDING_PAYMENT"
            - "PAID"
            - "PREPARING_DELIVERY"
            - "SHIPPING"
            - "DELIVERED"
            - "CANCELED"
        totalAmount:
          type: "integer"
          format: "int64"
          nullable: true
        receiverName:
          type: "string"
          nullable: true
        receiverPhone:
          type: "string"
          nullable: true
        deliveryAddress:
          type: "string"
          nullable: true
        deliveryRequest:
          type: "string"
          nullable: true
        items:
          type: "array"
          nullable: true
          items:
            $ref: "#/components/schemas/Item"
    UpdateMyInfoRequest:
      type: "object"
      properties:
        name:
          type: "string"
          nullable: true
        phone:
          type: "string"
          nullable: true
    MemberResponse:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
          nullable: true
        email:
          type: "string"
          nullable: true
        name:
          type: "string"
          nullable: true
        phone:
          type: "string"
          nullable: true
        grade:
          type: "string"
          nullable: true
        profileImageUrl:
          type: "string"
          nullable: true
    PaymentConfirmRequest:
      type: "object"
      properties:
